<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="DateWise AI - AI-powered dating coach">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DateWise AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DateWise AI</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#150C10">
  <!-- While the app downloads: the app's dark background and a simple loading
       indicator instead of a white page (QA m-5). Removed on the first frame. -->
  <style>
    html, body { margin: 0; height: 100%; background: #150C10; }
    #dw-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      color: #F6E6D6; font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #dw-loading .ring {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid rgba(246, 230, 214, 0.18); border-top-color: #DDB67F;
      animation: dw-spin 0.9s linear infinite;
    }
    @keyframes dw-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #dw-loading .ring { animation-duration: 3s; } }
  </style>
</head>
<body>
  <div id="dw-loading" role="status" aria-live="polite">
    <div class="ring" aria-hidden="true"></div>
    <div>DateWise AI</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('dw-loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
