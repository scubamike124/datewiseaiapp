<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file: 'unsafe-inline'; style-src 'unsafe-inline'; media-src 'self' file: blob: mediastream:; img-src 'self' data: blob:; connect-src https: wss:;">
<title>DateWise avatar</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: cover; background: transparent; }
</style>
</head>
<body>
<!-- The vendor face. playsinline: no fullscreen takeover on iPhone. No getUserMedia anywhere: the face only receives audio. -->
<video id="dw-video" autoplay playsinline muted></video>
<audio id="dw-audio" autoplay playsinline></audio>
<!-- Vendor SDKs are bundled with the app (tool/avatar_pilot/build_vendor.sh); never loaded from a CDN. -->
<script src="vendor/simli.js" onerror="window.__dwMissing=(window.__dwMissing||[]).concat('simli')"></script>
<script src="vendor/anam.js" onerror="window.__dwMissing=(window.__dwMissing||[]).concat('anam')"></script>
<script src="bridge.js"></script>
<script src="adapter_simli.js"></script>
<script src="adapter_anam.js"></script>
<script>window.dwAvatar.ready();</script>
</body>
</html>
