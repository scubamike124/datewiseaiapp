# Heap sized for this machine (~8 GB RAM). 8G was impossible to allocate and
# crashed the Kotlin compiler daemon mid-build ("Could not close incremental
# caches"). Keep this modest so the build doesn't exhaust system memory.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Avoid running too many parallel compiler workers on a low-RAM machine.
org.gradle.workers.max=2
# Non-incremental Kotlin compilation: avoids the flaky incremental cache writes
# that were failing on this machine. Slightly slower, but reliable.
kotlin.incremental=false
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
