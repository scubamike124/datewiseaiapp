name: datewise_ai
description: "DateWise AI - AI-powered dating coach"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# Build 100: CI TestFlight uploads use 100 + the run number (101 and up), so a
# manual upload of this build never collides with one (docs/appstore/checklist.md, step 19).
version: 2.0.0+100

environment:
  sdk: ^3.7.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # English and Spanish app chrome (gen-l10n ARB files in lib/l10n).
  flutter_localizations:
    sdk: flutter
  intl: any

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Local persistence (uses localStorage on web)
  shared_preferences: ^2.3.2

  # Unique ids for threads/messages
  uuid: ^4.5.1

  # App version (shown in Settings → About).
  package_info_plus: ^8.0.0

  # Opening external links: privacy policy, support email, store rating,
  # and the Play "manage subscription" page.
  url_launcher: ^6.3.0

  # Calls the secure coach backend (Cloudflare Worker, SSE chat stream)
  http: ^1.2.2

  # Hosted-avatar pilot (docs/avatar/PILOT_RUNBOOK.md): a WebView that runs the
  # vendor JS SDK. BSD-3, Flutter team. No first-party native code.
  webview_flutter: ^4.10.0
  webview_flutter_wkwebview: ^3.18.0

  # On-device voice: text-to-speech (MIT) and speech recognition (BSD-3).
  flutter_tts: ^4.2.5
  speech_to_text: ^7.5.0
  # The one auto-renewable subscription (official Flutter plugins, BSD-3).
  # StoreKit 2 current entitlements are read via in_app_purchase_storekit.
  in_app_purchase: ^3.3.1
  in_app_purchase_storekit: ^0.4.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Fake clock for the hosted-avatar heartbeat and timeout tests (already in the lock via flutter_test).
  fake_async: ^1.3.1
  # On-simulator end-to-end tests (integration_test/), e.g. the StoreKit Test
  # subscription test run by .github/workflows/storekit-e2e.yml.
  integration_test:
    sdk: flutter

  # Provides a fake image for Image.network in widget tests.
  network_image_mock: ^2.1.1

  # Generates Android/iOS launcher icons from a single source image.
  # Regenerate with: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

# App launcher icon (Android + iOS), generated from a single source image.
# Run `dart run flutter_launcher_icons` after changing app_icon.png.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  # iOS rejects icons with transparency; flatten any alpha just in case.
  remove_alpha_ios: true
  # The source is a finished tile (rounded corners + dark background baked in),
  # so we generate standard launcher icons and let the launcher apply its own
  # mask — rather than an adaptive icon, which would double the background and
  # clip the heart under the circular safe-zone.

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Generates lib/l10n/app_localizations*.dart from the ARB files (l10n.yaml).
  generate: true

  assets:
    # Coach portraits: {id}-hero.jpg and {id}-avatar.jpg for ava, ethan, sofia,
    # diego. Replace the files in place (same names) with the final portraits.
    - assets/coaches/
    # Talking-avatar patches generated from the portraits above
    # (tool/avatar/regenerate.sh); rebuild them whenever a portrait changes.
    - assets/avatar/ava/
    - assets/avatar/ethan/
    - assets/avatar/sofia/
    - assets/avatar/diego/
    # Hosted live-avatar pilot page, bridge, adapters and the bundled vendor SDKs
    # (docs/avatar/PILOT_RUNBOOK.md). Inert unless the AVATAR_HOSTED flag is on.
    - assets/avatar_pilot/
    - assets/avatar_pilot/vendor/

  # Bundled OFL fonts (licenses in assets/fonts/OFL-*.txt).
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Regular.ttf
        - asset: assets/fonts/Newsreader-Medium.ttf
          weight: 500
        - asset: assets/fonts/Newsreader-Italic.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
