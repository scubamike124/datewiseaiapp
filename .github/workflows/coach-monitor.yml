name: Coach monitor

# Every hour: is live coaching answering? On failure, opens (or updates) one
# issue labelled coach-down. Sends one short test message per language; no user
# data. Runs from main only (scheduled workflows always do).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKER: https://datewise-photo-coach.scubamike124.workers.dev
    steps:
      - name: Probe the coach in English and Spanish
        id: probe
        run: |
          set +e
          fail=""
          health=$(curl -sS --max-time 20 "$WORKER/?health"); echo "health: $health"
          for c in "emily|Give me one tip for a first message." "mateo|Dame un consejo para un primer mensaje."; do
            coach="${c%%|*}"; text="${c#*|}"
            body=$(jq -nc --arg c "$coach" --arg t "$text" '{coachId:$c,messages:[{role:"user",content:$t}]}')
            out=$(curl -sS --max-time 60 -D headers.txt -o reply.txt -w '%{http_code}' -X POST "$WORKER" -H 'Content-Type: application/json' -H 'Origin: https://datewiseai.com' -d "$body")
            model=$(grep -i '^x-datewise-model' headers.txt | tr -d '\r' | cut -d' ' -f2)
            chars=$(grep -o '"response":"[^"]*"' reply.txt | wc -c)
            echo "$coach: HTTP $out, model ${model:-?}, ${chars} chars"
            if [ "$out" != "200" ] || [ "$chars" -lt 20 ]; then fail="$fail $coach(HTTP $out: $(head -c 200 reply.txt))"; fi
          done
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
      - name: Open or update the coach-down issue
        if: steps.probe.outputs.fail != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FAIL: ${{ steps.probe.outputs.fail }}
        run: |
          gh label create coach-down --color B60205 --description "Live coach monitor failed" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --label coach-down --state open --json number --jq '.[0].number')
          msg="Coach monitor failed at $(date -u +%FT%TZ):$FAIL. Rollback: set the Worker variable CHAT_MODELS to a working model order in the Cloudflare dashboard (no redeploy), or redeploy a previous version with Deploy coach backend."
          if [ -n "$n" ]; then gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "$msg"; else gh issue create -R "$GITHUB_REPOSITORY" --label coach-down --title "Live coaching is failing" --body "$msg"; fi
          exit 1
