name: Backend tests

# Offline tests of the Cloudflare Worker (fake Workers AI binding, no network,
# no account). Deploys nothing.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test backend/worker.test.mjs backend/cost_guard.test.mjs backend/eval/model-eval.test.mjs
