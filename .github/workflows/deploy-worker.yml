name: Deploy coach backend

# Deploys backend/worker.js (the DateWise coach + photo coach Worker) to
# Cloudflare. MANUAL ONLY: it never runs on push or pull request. The owner
# starts it from GitHub (Actions -> Deploy coach backend -> Run workflow) and
# must type "deploy" to confirm. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   (Cloudflare template "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID
# The Worker's AI access is its Workers AI binding (wrangler.toml); no AI key.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to deploy backend/worker.js to production'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Offline Worker tests must pass first
        run: node --test backend/worker.test.mjs
      - name: Check the deploy secrets are set (values are never printed)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Add the CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy
      - name: Show the live version
        run: |
          sleep 10
          curl -sS --max-time 30 "https://datewise-photo-coach.scubamike124.workers.dev/?version"
