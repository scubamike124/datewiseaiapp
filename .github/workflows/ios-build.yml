name: iOS build

# Unsigned iOS release build on a macOS runner, to prove the app compiles for
# iOS (no Mac needed locally). GitHub-hosted runners, macOS included, are
# free on this public repository; to keep CI quick this still runs only
# when iOS-relevant files change, or by hand. No secrets are used by the
# default job, and nothing is signed, uploaded or submitted.
#
# The second job (signed-testflight) is a manual-only skeleton: it runs only
# from "Run workflow" with signed_build ticked, and every step after the
# secrets check is skipped unless all the signing secrets exist. See
# docs/appstore/checklist.md, section "6. Optional: CI signing secrets", for
# the exact secrets.
#
# Two signing modes (input `signing`):
#   manual (default): the distribution certificate (.p12) and App Store
#     provisioning profile from secrets, as before. Making those needs a
#     computer.
#   cloud: no certificate or profile secrets. The archive is built without
#     codesigning, then `xcodebuild -exportArchive` signs it with Xcode's
#     automatic signing, using a cloud-managed distribution certificate and an
#     App Store profile it creates itself, authenticated only by the App
#     Store Connect API key (-allowProvisioningUpdates -authenticationKey*).
#     The key needs the Admin role. Everything is done from an iPhone; see
#     docs/qa/IPHONE_E2E_DEMO.md section 2.1.
on:
  pull_request:
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Also run flutter test on macOS (tests already run on Linux in test.yml)'
        type: boolean
        default: false
      signed_build:
        description: 'Signed IPA build (needs the signing secrets; does nothing without them)'
        type: boolean
        default: false
      upload_testflight:
        description: 'After a signed build, upload the IPA to App Store Connect / TestFlight'
        type: boolean
        default: false
      avatar_audio_path:
        description: 'TestFlight device test of the talking avatar''s native audio path (DW_AVATAR_AUDIO_PATH). Leave off for a build meant for App Store review.'
        type: boolean
        default: false
      coach_backend:
        description: 'Coach backend of a signed build. "staging" = the isolated staging Worker, for the iPhone end-to-end demo only (build number +50000; never submit it for App Store review). See docs/qa/IPHONE_E2E_DEMO.md.'
        type: choice
        options:
          - production
          - staging
        default: production
      signing:
        description: 'Signing of a signed build. "manual" = certificate + profile secrets (needs a computer to make). "cloud" = Xcode cloud-managed signing with only the App Store Connect API key (Admin role); iPhone-only. Needs signed_build.'
        type: choice
        options:
          - manual
          - cloud
        default: manual

permissions:
  contents: read

concurrency:
  # Runs with different build inputs never cancel each other (a staging
  # TestFlight run must not cancel a production one); a re-run of the same
  # kind still replaces the older run.
  group: ios-build-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.signed_build && 'signed' || 'unsigned' }}-${{ inputs.coach_backend || 'production' }}-${{ inputs.signing || 'manual' }}-${{ inputs.avatar_audio_path && 'audio' || 'tts' }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  unsigned:
    name: Unsigned release build (no codesign)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: upload_testflight needs signed_build
        if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight && !inputs.signed_build
        run: |
          echo "::error::upload_testflight was ticked without signed_build. Tick signed_build too; nothing would be uploaded."
          exit 1

      - name: coach_backend staging needs signed_build
        if: github.event_name == 'workflow_dispatch' && inputs.coach_backend == 'staging' && !inputs.signed_build
        run: |
          echo "::error::coach_backend=staging only applies to the signed TestFlight build. Tick signed_build too; this unsigned build always targets production."
          exit 1

      - name: signing cloud needs signed_build
        if: github.event_name == 'workflow_dispatch' && inputs.signing == 'cloud' && !inputs.signed_build
        run: |
          echo "::error::signing=cloud only applies to the signed TestFlight build. Tick signed_build too; this unsigned build is never signed."
          exit 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Toolchain
        run: |
          flutter --version
          xcodebuild -version
          sw_vers

      - run: flutter pub get

      - name: flutter test
        if: github.event_name == 'workflow_dispatch' && inputs.run_tests
        run: flutter test

      - name: flutter build ios --release --no-codesign
        run: flutter build ios --release --no-codesign

      - name: Build settings summary
        run: |
          APP=build/ios/iphoneos/Runner.app
          PB=/usr/libexec/PlistBuddy
          {
            echo "## iOS build summary"
            echo ""
            echo "| Setting | Value |"
            echo "|--|--|"
            echo "| Bundle id | $($PB -c 'Print :CFBundleIdentifier' $APP/Info.plist) |"
            echo "| Display name | $($PB -c 'Print :CFBundleDisplayName' $APP/Info.plist) |"
            echo "| Version | $($PB -c 'Print :CFBundleShortVersionString' $APP/Info.plist) |"
            echo "| Build | $($PB -c 'Print :CFBundleVersion' $APP/Info.plist) |"
            echo "| Minimum iOS | $($PB -c 'Print :MinimumOSVersion' $APP/Info.plist) |"
            echo "| Localizations | $($PB -c 'Print :CFBundleLocalizations' $APP/Info.plist | tr -d '\n' | tr -s ' ') |"
            echo "| ITSAppUsesNonExemptEncryption | $($PB -c 'Print :ITSAppUsesNonExemptEncryption' $APP/Info.plist) |"
            echo "| PrivacyInfo.xcprivacy in bundle | $(test -f $APP/PrivacyInfo.xcprivacy && echo yes || echo NO) |"
            echo "| es.lproj/InfoPlist.strings in bundle | $(test -f $APP/es.lproj/InfoPlist.strings && echo yes || echo NO) |"
            echo "| App size | $(du -sh $APP | cut -f1) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$($PB -c 'Print :CFBundleIdentifier' $APP/Info.plist)" = "com.datewise.datewiseAi"
          test -f $APP/PrivacyInfo.xcprivacy
          test -f $APP/es.lproj/InfoPlist.strings
          plutil -lint $APP/PrivacyInfo.xcprivacy

      - name: Files the Flutter tool changed during the build
        # Flutter migrates iOS projects in place (Swift Package Manager,
        # CocoaPods for plugins without SPM, UIScene). Commit this patch so
        # local Xcode archives match CI.
        run: |
          git add -N ios
          git diff --stat -- ios
          git diff -- ios > ios-flutter-migrations.patch
          wc -l ios-flutter-migrations.patch
          echo "----- BEGIN ios-flutter-migrations.patch -----"
          cat ios-flutter-migrations.patch
          echo "----- END ios-flutter-migrations.patch -----"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ios-flutter-migrations
          path: ios-flutter-migrations.patch
          retention-days: 7

      - name: Zip Runner.app
        run: |
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app "$GITHUB_WORKSPACE/Runner-app-unsigned.zip"
          ls -lh "$GITHUB_WORKSPACE/Runner-app-unsigned.zip"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: datewise-ios-Runner-app-unsigned
          path: Runner-app-unsigned.zip
          retention-days: 14
          if-no-files-found: error

  signed-testflight:
    name: Signed IPA / TestFlight (manual, needs secrets)
    if: github.event_name == 'workflow_dispatch' && inputs.signed_build
    runs-on: macos-latest
    timeout-minutes: 60
    # No secrets at job level: each step gets only the secrets it uses. The
    # check below sees only whether each secret is set ("true"/"false").
    steps:
      - name: Check signing secrets
        id: secrets
        env:
          SIGNING: ${{ inputs.signing }}
          HAS_IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' }}
          HAS_IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD != '' }}
          HAS_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID != '' }}
          HAS_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID != '' }}
          HAS_APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 != '' }}
        run: |
          case "$SIGNING" in
            manual|"") needed="IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 APPLE_TEAM_ID APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8" ;;
            # Cloud signing: only the App Store Connect API key and the team.
            cloud) needed="APPLE_TEAM_ID APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8" ;;
            *) echo "::error::Unknown signing mode"; exit 1 ;;
          esac
          echo "Signing: ${SIGNING:-manual}" >> "$GITHUB_STEP_SUMMARY"
          missing=""
          for v in $needed; do
            h="HAS_$v"
            if [ "${!h}" != "true" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Signing secrets missing:$missing. Nothing was built or uploaded. See docs/appstore/checklist.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            # A signed build was requested: fail visibly instead of ending green.
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.secrets.outputs.ready == 'true'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: steps.secrets.outputs.ready == 'true'
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install certificate and provisioning profile
        if: steps.secrets.outputs.ready == 'true' && inputs.signing != 'cloud'
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"

          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Manual signing for the Runner target (CI checkout only, not committed)
        if: steps.secrets.outputs.ready == 'true' && inputs.signing != 'cloud'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # The team id goes into sed and a plist: accept only its real form.
          if ! [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_TEAM_ID must be the 10-character Team ID."; exit 1
          fi
          # Only the Runner target's configurations end in exactly "datewiseAi;"
          # (RunnerTests is ...datewiseAi.RunnerTests), so plugin targets keep
          # their own signing settings.
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com.datewise.datewiseAi;/PRODUCT_BUNDLE_IDENTIFIER = com.datewise.datewiseAi; CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = $APPLE_TEAM_ID; CODE_SIGN_IDENTITY = \"Apple Distribution\"; PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";/" ios/Runner.xcodeproj/project.pbxproj
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>com.datewise.datewiseAi</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          sed -i '' 's/^          //' "$RUNNER_TEMP/ExportOptions.plist"
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Cloud signing for the Runner target (CI checkout only, not committed)
        if: steps.secrets.outputs.ready == 'true' && inputs.signing == 'cloud'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # The team id goes into sed and a plist: accept only its real form.
          if ! [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_TEAM_ID must be the 10-character Team ID."; exit 1
          fi
          # Automatic signing with the team on the Runner target only (same
          # anchor as the manual step). The project defaults stay unchanged.
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com.datewise.datewiseAi;/PRODUCT_BUNDLE_IDENTIFIER = com.datewise.datewiseAi; CODE_SIGN_STYLE = Automatic; DEVELOPMENT_TEAM = $APPLE_TEAM_ID;/" ios/Runner.xcodeproj/project.pbxproj
          test "$(grep -c "DEVELOPMENT_TEAM = $APPLE_TEAM_ID;" ios/Runner.xcodeproj/project.pbxproj)" = "3"
          # manageAppVersionAndBuildNumber false keeps the workflow's build
          # number; destination export leaves the upload to altool below.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          sed -i '' 's/^          //' "$RUNNER_TEMP/ExportOptions.plist"
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: flutter build ipa
        if: steps.secrets.outputs.ready == 'true'
        env:
          AVATAR_AUDIO_PATH: ${{ inputs.avatar_audio_path && 'true' || 'false' }}
          COACH_BACKEND: ${{ inputs.coach_backend }}
          SIGNING: ${{ inputs.signing }}
        run: |
          flutter pub get
          # The coach backend is a fixed choice, never a free-form URL. The
          # staging host is a constant here (docs/launch/WORKER_DEPLOY_RUNBOOK.md
          # section 9); production builds pass no define and keep
          # AIConfig.productionUrl.
          STAGING_COACH_URL="https://datewise-coach-staging.scubamike124.workers.dev"
          DEFINES=(--dart-define=DW_AVATAR_AUDIO_PATH="$AVATAR_AUDIO_PATH")
          case "$COACH_BACKEND" in
            production|"") COACH_BACKEND=production ;;
            staging) DEFINES+=(--dart-define=COACH_BACKEND_URL="$STAGING_COACH_URL") ;;
            *) echo "::error::Unknown coach_backend"; exit 1 ;;
          esac
          # App Store Connect rejects a second upload with the same
          # CFBundleVersion: derive the build number from the run (the +100
          # offset keeps it above pubspec's +N and any earlier uploads).
          BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))
          if [ "$AVATAR_AUDIO_PATH" = "true" ]; then
            # A device-test build of the avatar's native audio path: its own
            # build-number range (+5000) so it is never mistaken for, or
            # promoted as, an App Store candidate.
            BUILD_NUMBER=$((5000 + BUILD_NUMBER))
            echo "### ⚠️ AVATAR AUDIO-PATH TEST BUILD (DW_AVATAR_AUDIO_PATH=true): TestFlight device test only, do NOT submit for App Store review" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$COACH_BACKEND" = "staging" ]; then
            # A build pointed at the staging Worker: its own range (+50000,
            # e.g. 50150, or 55150 with the audio path) so it can never be
            # mistaken for, or submitted as, an App Store build. Production
            # users never get it: it reaches only TestFlight testers.
            BUILD_NUMBER=$((50000 + BUILD_NUMBER))
            echo "### ⚠️ STAGING COACH BUILD (COACH_BACKEND_URL=$STAGING_COACH_URL): TestFlight iPhone demo only, do NOT submit for App Store review" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Coach backend: $COACH_BACKEND" >> "$GITHUB_STEP_SUMMARY"
          echo "COACH_BACKEND=$COACH_BACKEND" >> "$GITHUB_ENV"
          echo "Build number: $BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          # The avatar's native audio path stays off unless this run is a
          # TestFlight device test (docs/avatar/TALKING_AVATARS.md).
          echo "DW_AVATAR_AUDIO_PATH=$AVATAR_AUDIO_PATH" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIGNING" = "cloud" ]; then
            # Cloud signing: build only the archive here (no development
            # certificate, profile or registered device needed). The next
            # step signs it while exporting.
            SIGN_ARGS=(--no-codesign)
          else
            SIGN_ARGS=(--export-options-plist="$RUNNER_TEMP/ExportOptions.plist")
          fi
          flutter build ipa --release --build-number="$BUILD_NUMBER" \
            "${DEFINES[@]}" \
            "${SIGN_ARGS[@]}"
          if [ "$SIGNING" = "cloud" ]; then
            test -d build/ios/archive/Runner.xcarchive
          else
            ls -lh build/ios/ipa
          fi
          # Prove which coach host the compiled Dart code carries.
          APP_BIN=$(find build/ios/archive -path '*App.framework/App' -type f | head -n 1)
          test -n "$APP_BIN"
          # Symmetric: each build must carry its own host and not the other's.
          # (AIConfig.productionUrl is a compile-time constant, so a staging
          # build with COACH_BACKEND_URL may still carry it; only its use
          # matters there, which test/staging_device_demo_test.dart covers.)
          if [ "$COACH_BACKEND" = "staging" ]; then
            if ! grep -a -q "datewise-coach-staging.scubamike124.workers.dev" "$APP_BIN"; then
              echo "::error::The staging build does not contain the staging coach host."; exit 1
            fi
          else
            if ! grep -a -q "datewise-photo-coach.scubamike124.workers.dev" "$APP_BIN"; then
              echo "::error::A production build does not contain the production coach host."; exit 1
            fi
            if grep -a -q "datewise-coach-staging" "$APP_BIN"; then
              echo "::error::A production build contains the staging coach host."; exit 1
            fi
          fi
          echo "Coach host check passed ($COACH_BACKEND)" >> "$GITHUB_STEP_SUMMARY"

      - name: Export and sign the IPA with cloud-managed signing
        if: steps.secrets.outputs.ready == 'true' && inputs.signing == 'cloud'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          # The key id becomes a file name: accept only its real form.
          if ! [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APP_STORE_CONNECT_API_KEY_ID must be the 10-character Key ID."; exit 1
          fi
          # The .p8 lives only in RUNNER_TEMP, readable by this user only, and
          # is removed by the always() cleanup step. It is never printed.
          (
            umask 077
            mkdir -p "$RUNNER_TEMP/asc"
            printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          )
          if ! grep -q -- '-----BEGIN PRIVATE KEY-----' "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"; then
            echo "::error::APP_STORE_CONNECT_API_KEY_P8 must be the full .p8 text, including the BEGIN/END lines."; exit 1
          fi
          # Automatic signing: Xcode uses (or creates) the team's
          # cloud-managed Apple Distribution certificate and an App Store
          # profile for com.datewise.datewiseAi. Needs an Admin-role key.
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          rm -f "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          ls -lh build/ios/ipa
          # Prove the IPA is distribution-signed and carries this run's build number.
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          rm -rf "$RUNNER_TEMP/ipa-check"
          mkdir -p "$RUNNER_TEMP/ipa-check"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa-check"
          APP=$(find "$RUNNER_TEMP/ipa-check/Payload" -maxdepth 1 -name '*.app' | head -n 1)
          codesign --verify --deep --strict "$APP"
          if ! codesign -dvv "$APP" 2>&1 | grep -q '^Authority=Apple Distribution'; then
            echo "::error::The exported app is not signed with an Apple Distribution certificate."; exit 1
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$BUILD_NUMBER"
          echo "Cloud-managed signing: Apple Distribution, build $BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: ${{ inputs.coach_backend == 'staging' && 'datewise-ios-ipa-signed-STAGING' || 'datewise-ios-ipa-signed' }}
          path: build/ios/ipa/*.ipa
          retention-days: 7
          if-no-files-found: error

      - name: Upload to App Store Connect (TestFlight)
        if: steps.secrets.outputs.ready == 'true' && inputs.upload_testflight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          # altool's old upload-app command is deprecated; Apple's altool documentation
          # names `--upload-package` (App Store Connect API key auth) as its
          # replacement for uploading builds. altool finds the key in
          # ~/.appstoreconnect/private_keys/AuthKey_<key id>.p8.
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          xcrun altool --upload-package "$IPA" --type ios \
            --apple-id 6780110141 --bundle-id com.datewise.datewiseAi \
            --bundle-version "$BUILD_NUMBER" --bundle-short-version-string "$VERSION" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" \
            "$RUNNER_TEMP/ExportOptions.plist"
          rm -rf "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP/asc" "$RUNNER_TEMP/ipa-check"
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
              "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
