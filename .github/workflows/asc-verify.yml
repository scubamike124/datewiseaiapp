name: App Store Connect check (read-only)

# Read-only check of the App Store Connect API key in the repository secrets,
# the DateWise app record and its one subscription. It makes GET requests only:
# nothing is created, changed, signed, built or uploaded. Secret values are
# never printed; the summary shows only public facts (app name, product id,
# period, state, US price) and pass/fail per check.
on:
  push:
    branches:
      - claude/asc-verify
    paths:
      - '.github/workflows/asc-verify.yml'
      - 'tool/asc/verify_asc.py'
      - 'tool/asc/asc-subscriptions.mjs'
      - 'tool/asc/subscriptions.json'
      - 'tool/asc/approved-plan.txt'
      - 'tool/asc/upload_review_screenshot.py'
      - 'tool/asc/review-screenshot.png'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asc-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify App Store Connect key, app and subscription
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install PyJWT and cryptography
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check --quiet 'PyJWT==2.10.1' 'cryptography==44.0.3'
      - name: Check
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: com.datewise.datewiseAi
          PRODUCT_ID: datewise_premium_monthly
          EXPECTED_USD: '19.99'
        run: '"$RUNNER_TEMP/venv/bin/python" -I tool/asc/verify_asc.py'
        continue-on-error: true
      - name: White Glove subscription dry run (read-only, GET requests only)
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: node tool/asc/asc-subscriptions.mjs plan --spec tool/asc/subscriptions.json

  apply:
    # Writes to App Store Connect. Runs only for a commit whose message contains [asc-apply], only after the
    # owner approves the run in the app-store-connect-write environment, and only the plan whose hash is in
    # tool/asc/approved-plan.txt (create-only; nothing is deleted or edited). Then it proves a second run
    # creates nothing and that every existing price, country and setting is identical.
    name: Apply the approved subscription plan (owner approval required)
    needs: verify
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[asc-apply]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: app-store-connect-write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Apply, re-run to prove no duplicates, compare before and after
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          S=tool/asc/subscriptions.json
          T="$RUNNER_TEMP"
          APPROVED=$(tr -d ' \n' < tool/asc/approved-plan.txt)
          node tool/asc/asc-subscriptions.mjs plan --spec "$S" --json "$T/before.json" > /dev/null
          echo "## First apply (approved plan $APPROVED)"
          node tool/asc/asc-subscriptions.mjs apply --spec "$S" --expect-plan "$APPROVED"
          node tool/asc/asc-subscriptions.mjs plan --spec "$S" --json "$T/after.json" > /dev/null
          H=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).hash)' "$T/after.json")
          echo "## Second apply (must create nothing)"
          node tool/asc/asc-subscriptions.mjs apply --spec "$S" --expect-plan "$H" | tee "$T/second.txt"
          grep -q '^Created 0:' "$T/second.txt"
          node tool/asc/asc-subscriptions.mjs plan --spec "$S" --json "$T/final.json" > /dev/null
          node tool/asc/asc-subscriptions.mjs compare --before "$T/before.json" --after "$T/final.json"

  review-screenshot:
    # Writes to App Store Connect: uploads the subscription's App Store review screenshot (the paywall,
    # tool/asc/review-screenshot.png). Runs only for a commit whose message contains [asc-screenshot] and only
    # after the owner approves the run in the app-store-connect-write environment. Idempotent; never deletes
    # or edits anything else. Without this screenshot the subscription stays in MISSING_METADATA and StoreKit
    # does not offer it to TestFlight or the sandbox.
    name: Upload the subscription review screenshot (owner approval required)
    needs: verify
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[asc-screenshot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: app-store-connect-write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install PyJWT and cryptography
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check --quiet 'PyJWT==2.10.1' 'cryptography==44.0.3'
      - name: Upload, wait for processing, re-check
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: com.datewise.datewiseAi
          PRODUCT_ID: datewise_premium_monthly
          EXPECTED_USD: '19.99'
          SCREENSHOT: tool/asc/review-screenshot.png
        run: |
          "$RUNNER_TEMP/venv/bin/python" -I tool/asc/upload_review_screenshot.py
          "$RUNNER_TEMP/venv/bin/python" -I tool/asc/verify_asc.py || true

